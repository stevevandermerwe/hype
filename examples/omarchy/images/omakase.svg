<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160f1c"/>
      <stop offset="0.55" stop-color="#201323"/>
      <stop offset="1" stop-color="#2a1723"/>
    </linearGradient>
    <radialGradient id="amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#f5a623" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ff5c7a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cream" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3c2" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#ffe3c2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffe3c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="140"/>
    </filter>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b2b"/>
      <stop offset="1" stop-color="#1d1320"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>

  <circle cx="760" cy="420" r="900" fill="url(#coral)" filter="url(#soft)" opacity="0.5"/>
  <circle cx="3080" cy="360" r="760" fill="url(#amber)" filter="url(#soft)" opacity="0.5"/>
  <circle cx="1920" cy="1900" r="820" fill="url(#cream)" filter="url(#soft)" opacity="0.3"/>

  <!-- A large "plate": concentric rings suggesting a curated omakase selection -->
  <g>
    <circle cx="1920" cy="1080" r="760" fill="url(#plate)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="1920" cy="1080" r="620" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    <circle cx="1920" cy="1080" r="480" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

    <!-- Dishes arranged around the plate -->
    <circle cx="1440" cy="820" r="90" fill="#ff5c7a" opacity="0.85"/>
    <circle cx="1920" cy="700" r="70" fill="#f5a623" opacity="0.9"/>
    <circle cx="2400" cy="820" r="90" fill="#34d1bf" opacity="0.85"/>
    <circle cx="1560" cy="1240" r="60" fill="#f5a623" opacity="0.8"/>
    <circle cx="2280" cy="1240" r="60" fill="#ffe3c2" opacity="0.7"/>
    <circle cx="1920" cy="1120" r="130" fill="#7c6cf0" opacity="0.55"/>
  </g>

  <!-- Accent dots -->
  <circle cx="700" cy="1500" r="8" fill="#f5a623" opacity="0.9"/>
  <circle cx="3140" cy="1500" r="10" fill="#ff5c7a" opacity="0.9"/>
</svg>
