<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1122"/>
      <stop offset="0.55" stop-color="#0f1a2a"/>
      <stop offset="1" stop-color="#121c33"/>
    </linearGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d1bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34d1bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="150"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>

  <circle cx="640" cy="420" r="820" fill="url(#teal)" filter="url(#soft)" opacity="0.5"/>
  <circle cx="3200" cy="420" r="800" fill="url(#violet)" filter="url(#soft)" opacity="0.5"/>
  <circle cx="3200" cy="1760" r="780" fill="url(#coral)" filter="url(#soft)" opacity="0.4"/>
  <circle cx="700" cy="1760" r="700" fill="url(#violet)" filter="url(#soft)" opacity="0.4"/>

  <!-- Agent network graph: nodes and connecting lines, kept toward the right -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
    <line x1="2400" y1="520" x2="3100" y2="700"/>
    <line x1="2400" y1="520" x2="2550" y2="1150"/>
    <line x1="3100" y1="700" x2="3400" y2="1200"/>
    <line x1="2550" y1="1150" x2="3100" y2="700"/>
    <line x1="2550" y1="1150" x2="3400" y2="1200"/>
    <line x1="3100" y1="700" x2="3400" y2="700"/>
    <line x1="3400" y1="1200" x2="3600" y2="1560"/>
    <line x1="2550" y1="1150" x2="2100" y2="1500"/>
    <line x1="3400" y1="700" x2="3600" y2="420"/>
    <line x1="3100" y1="700" x2="2900" y2="380"/>
    <line x1="2400" y1="520" x2="2900" y2="380"/>
  </g>

  <g>
    <circle cx="2400" cy="520" r="90" fill="#34d1bf" filter="url(#glow)" opacity="0.9"/>
    <circle cx="2400" cy="520" r="34" fill="#34d1bf"/>
    <circle cx="3100" cy="700" r="80" fill="#7c6cf0" filter="url(#glow)" opacity="0.9"/>
    <circle cx="3100" cy="700" r="30" fill="#7c6cf0"/>
    <circle cx="2550" cy="1150" r="76" fill="#ff5c7a" filter="url(#glow)" opacity="0.9"/>
    <circle cx="2550" cy="1150" r="28" fill="#ff5c7a"/>
    <circle cx="3400" cy="700" r="60" fill="#f5a623" filter="url(#glow)" opacity="0.85"/>
    <circle cx="3400" cy="700" r="22" fill="#f5a623"/>
    <circle cx="3400" cy="1200" r="54" fill="#34d1bf" filter="url(#glow)" opacity="0.85"/>
    <circle cx="3400" cy="1200" r="20" fill="#34d1bf"/>
    <circle cx="3600" cy="1560" r="46" fill="#7c6cf0" filter="url(#glow)" opacity="0.85"/>
    <circle cx="3600" cy="1560" r="16" fill="#7c6cf0"/>
    <circle cx="3600" cy="420" r="46" fill="#ff5c7a" filter="url(#glow)" opacity="0.85"/>
    <circle cx="3600" cy="420" r="16" fill="#ff5c7a"/>
    <circle cx="2900" cy="380" r="40" fill="#34d1bf" filter="url(#glow)" opacity="0.8"/>
    <circle cx="2900" cy="380" r="14" fill="#34d1bf"/>
    <circle cx="2100" cy="1500" r="40" fill="#f5a623" filter="url(#glow)" opacity="0.8"/>
    <circle cx="2100" cy="1500" r="14" fill="#f5a623"/>
  </g>
</svg>
