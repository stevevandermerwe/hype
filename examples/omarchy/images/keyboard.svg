<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0e20"/>
      <stop offset="0.55" stop-color="#141229"/>
      <stop offset="1" stop-color="#181334"/>
    </linearGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d1bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34d1bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="150"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>

  <circle cx="600" cy="420" r="820" fill="url(#teal)" filter="url(#soft)" opacity="0.5"/>
  <circle cx="3240" cy="420" r="800" fill="url(#violet)" filter="url(#soft)" opacity="0.5"/>
  <circle cx="3240" cy="1760" r="780" fill="url(#coral)" filter="url(#soft)" opacity="0.4"/>

  <!-- Loose keyboard arc of rounded keycaps, one accent key highlighted -->
  <g>
    <!-- Row 1 -->
    <rect x="1180" y="700" width="150" height="110" rx="26" fill="#ffffff" opacity="0.08"/>
    <rect x="1350" y="700" width="150" height="110" rx="26" fill="#ffffff" opacity="0.08"/>
    <rect x="1520" y="700" width="150" height="110" rx="26" fill="#ffffff" opacity="0.08"/>
    <rect x="1690" y="700" width="150" height="110" rx="26" fill="#ffffff" opacity="0.08"/>
    <rect x="1860" y="700" width="150" height="110" rx="26" fill="#ffffff" opacity="0.08"/>
    <rect x="2030" y="700" width="150" height="110" rx="26" fill="#ffffff" opacity="0.08"/>
    <rect x="2200" y="700" width="150" height="110" rx="26" fill="#ffffff" opacity="0.08"/>

    <!-- Row 2 -->
    <rect x="1260" y="840" width="150" height="110" rx="26" fill="#ffffff" opacity="0.1"/>
    <rect x="1430" y="840" width="150" height="110" rx="26" fill="#ffffff" opacity="0.1"/>
    <rect x="1600" y="840" width="150" height="110" rx="26" fill="#ffffff" opacity="0.1"/>
    <rect x="1770" y="840" width="150" height="110" rx="26" fill="#ffffff" opacity="0.1"/>
    <rect x="1940" y="840" width="150" height="110" rx="26" fill="#ffffff" opacity="0.1"/>
    <rect x="2110" y="840" width="150" height="110" rx="26" fill="#ffffff" opacity="0.1"/>

    <!-- Row 3 -->
    <rect x="1430" y="980" width="150" height="110" rx="26" fill="#ffffff" opacity="0.12"/>
    <rect x="1600" y="980" width="150" height="110" rx="26" fill="#ffffff" opacity="0.12"/>
    <rect x="1770" y="980" width="150" height="110" rx="26" fill="#ffffff" opacity="0.12"/>
    <rect x="1940" y="980" width="150" height="110" rx="26" fill="#ffffff" opacity="0.12"/>

    <!-- Accent "SUPER" key -->
    <rect x="1600" y="1160" width="320" height="110" rx="26" fill="#34d1bf" opacity="0.95" filter="url(#glow)"/>
    <rect x="1616" y="1176" width="288" height="78" rx="20" fill="#0f0e20" opacity="0.0"/>
    <text x="1760" y="1235" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="52" font-weight="700" fill="#0f1a1a">SUPER</text>

    <!-- Side keys -->
    <rect x="1160" y="840" width="80" height="110" rx="22" fill="#7c6cf0" opacity="0.7"/>
    <rect x="2380" y="840" width="80" height="110" rx="22" fill="#7c6cf0" opacity="0.7"/>
    <rect x="1600" y="1300" width="150" height="110" rx="26" fill="#ffffff" opacity="0.08"/>
  </g>

  <circle cx="720" cy="1560" r="8" fill="#34d1bf" opacity="0.9"/>
  <circle cx="3120" cy="1560" r="10" fill="#7c6cf0" opacity="0.9"/>
</svg>
