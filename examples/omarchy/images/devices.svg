<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1022"/>
      <stop offset="0.55" stop-color="#121630"/>
      <stop offset="1" stop-color="#151a38"/>
    </linearGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d1bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34d1bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="150"/>
    </filter>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23284a"/>
      <stop offset="1" stop-color="#181d3a"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>

  <circle cx="600" cy="420" r="820" fill="url(#teal)" filter="url(#soft)" opacity="0.45"/>
  <circle cx="3240" cy="420" r="800" fill="url(#violet)" filter="url(#soft)" opacity="0.45"/>
  <circle cx="3240" cy="1760" r="780" fill="url(#coral)" filter="url(#soft)" opacity="0.38"/>

  <!-- Device silhouettes: laptop, tower + monitor, vintage Mac, tablet -->
  <g>
    <!-- Laptop -->
    <rect x="560" y="980" width="760" height="500" rx="28" fill="url(#device)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="500" y="1500" width="880" height="40" rx="20" fill="#23284a" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- Desktop monitor + tower -->
    <rect x="1520" y="860" width="700" height="430" rx="26" fill="url(#device)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="1790" y="1290" width="160" height="220" rx="10" fill="#23284a"/>
    <rect x="1700" y="1510" width="340" height="30" rx="15" fill="#23284a"/>
    <rect x="2320" y="1100" width="180" height="420" rx="20" fill="#23284a" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- Tablet -->
    <rect x="2860" y="940" width="440" height="620" rx="42" fill="url(#device)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- Accent dots -->
  <circle cx="700" cy="620" r="8" fill="#34d1bf" opacity="0.9"/>
  <circle cx="3160" cy="620" r="10" fill="#7c6cf0" opacity="0.9"/>
  <circle cx="1520" cy="600" r="7" fill="#ff5c7a" opacity="0.9"/>
</svg>
