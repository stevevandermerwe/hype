<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0d0c22"/>
      <stop offset="0.55" stop-color="#151232"/>
      <stop offset="1" stop-color="#1d1640"/>
    </linearGradient>
    <radialGradient id="coral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ff5c7a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d1bf" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#34d1bf" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#34d1bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#7c6cf0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#f5a623" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="160"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>

  <!-- Glowing color fields, kept to the edges so the center stays calm for the headline -->
  <circle cx="520" cy="380" r="980" fill="url(#coral)" filter="url(#soft)" opacity="0.55"/>
  <circle cx="3320" cy="300" r="820" fill="url(#teal)" filter="url(#soft)" opacity="0.5"/>
  <circle cx="3380" cy="1850" r="950" fill="url(#violet)" filter="url(#soft)" opacity="0.5"/>
  <circle cx="460" cy="1840" r="720" fill="url(#amber)" filter="url(#soft)" opacity="0.32"/>

  <!-- Subtle horizon line and a thin ring to give the slide a designed feel -->
  <line x1="1920" y1="1230" x2="1920" y2="1230" stroke="none"/>
  <rect x="1470" y="1280" width="900" height="3" rx="1.5" fill="#ffffff" opacity="0.28"/>
  <circle cx="1920" cy="1100" r="1180" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- A few crisp accent dots -->
  <circle cx="720" cy="560" r="10" fill="#ff5c7a" opacity="0.9"/>
  <circle cx="3130" cy="500" r="8" fill="#34d1bf" opacity="0.9"/>
  <circle cx="3000" cy="1640" r="12" fill="#7c6cf0" opacity="0.9"/>
  <circle cx="900" cy="1580" r="7" fill="#f5a623" opacity="0.9"/>
</svg>
