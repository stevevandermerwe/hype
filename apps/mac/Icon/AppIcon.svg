<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Hype for Mac</title>
  <desc>The Hype mark — a pile of slides whose top slide carries a Markdown headline — on a macOS-style rounded tile with a violet-to-blue gradient and a small AI sparkle.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#c9a8ff"/>
      <stop offset="0.5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#3552a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8fb4ff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20223a"/>
      <stop offset="1" stop-color="#15161f"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="slideShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b0c2a" flood-opacity="0.45"/>
    </filter>
    <filter id="sparkleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- The tile: Apple's 824pt icon grid inside a 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- The slide pile, from pkgbuild/hype.svg, re-centred and scaled onto the tile. -->
  <g transform="translate(512 548) scale(1.72) translate(-256 -259)">
    <rect x="132" y="133" width="248" height="140" rx="16" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="108" y="159" width="296" height="161" rx="17" fill="#ffffff" fill-opacity="0.72"/>
    <g filter="url(#slideShadow)">
      <rect x="84" y="185" width="344" height="194" rx="18" fill="url(#face)"/>
    </g>
    <rect x="85.5" y="186.5" width="341" height="191" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
    <path d="M153.800 218.400L145 293.200M184.600 218.400L175.800 293.200M131.800 242.600H202.200M127.400 269H197.800" fill="none" stroke="url(#ink)" stroke-width="17" stroke-linecap="round"/>
    <rect x="228" y="243" width="164" height="25" rx="12.500" fill="#c0caf5"/>
    <rect x="122" y="320" width="270" height="15" rx="7.500" fill="#565f89"/>
    <rect x="122" y="347" width="186" height="15" rx="7.500" fill="#565f89" opacity=".55"/>
  </g>

  <!-- AI sparkles, top right. -->
  <g fill="#ffffff" filter="url(#sparkleGlow)">
    <path transform="translate(790 236) scale(0.95)" d="M0-62C7-9 9-7 62 0C9 7 7 9 0 62C-7 9-9 7-62 0C-9-7-7-9 0-62Z"/>
    <path transform="translate(712 180) scale(0.42)" d="M0-62C7-9 9-7 62 0C9 7 7 9 0 62C-7 9-9 7-62 0C-9-7-7-9 0-62Z"/>
  </g>
</svg>
